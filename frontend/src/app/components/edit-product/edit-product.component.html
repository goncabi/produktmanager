<div class="pb-container pb-container--narrow pb-form-page">
  <nav aria-label="Brotkrumen" class="pb-breadcrumb">
    <ol>
      <li><a routerLink="/products">Produkte</a></li>
      <li aria-hidden="true" class="crumb-sep"><app-icon name="chevron-right" [size]="14" /></li>
      @if (editProductForm.get('name')?.value) {
        <li><a [routerLink]="['/product', productId]">{{ editProductForm.get('name')?.value }}</a></li>
        <li aria-hidden="true" class="crumb-sep"><app-icon name="chevron-right" [size]="14" /></li>
      }
      <li><span aria-current="page">Bearbeiten</span></li>
    </ol>
  </nav>

  <div class="pb-form-title">
    <h1 class="pb-page-title">Produkt bearbeiten</h1>
    <span class="pb-form-hint"><span class="req" aria-hidden="true">*</span> Pflichtfeld</span>
  </div>

  <form [formGroup]="editProductForm" novalidate
        (ngSubmit)="revealErrors(editProductForm, $event); submitForm()">
    <app-product-form-fields [form]="editProductForm" [categories]="categories" />

    <div class="pb-form-actions">
      <button type="button" class="pb-btn pb-btn--secondary" (click)="cancelEdit()">
        Abbrechen
      </button>
      <button type="submit" class="pb-btn pb-btn--primary" [disabled]="isSubmitting">
        <app-icon name="check" [size]="18" [strokeWidth]="2.2" />
        Produkt speichern
      </button>
    </div>
  </form>
</div>
